# Friendly CRM — nginx: serves the SPA, proxies /api to the Fastify backend.
# After certbot issues certificates, uncomment the 443 block and the redirect.

# The SPA is a single-file build with inline scripts/styles, so CSP must
# permit 'unsafe-inline'; every other directive is locked to 'self'. Adjust
# connect-src if you point the app at an API on a different host.

server {
    listen 80;
    server_name _;                     # replace with your domain, e.g. crm.example.com
    server_tokens off;                 # don't leak the nginx version in headers / error pages

    # ACME challenge for certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Uncomment after SSL is issued to force HTTPS:
    # location / { return 301 https://$host$request_uri; }

    # ── Security headers ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # Deny powerful features the app doesn't use; geolocation IS used (the
    # geo-verified site check-in) so it stays self-allowed.
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── PWA ──
    # nginx's bundled mime.types has no entry for .webmanifest on many builds,
    # so it would be sent as application/octet-stream — Chrome then ignores the
    # manifest entirely and the install prompt SILENTLY never fires. Declare it.
    types { application/manifest+json webmanifest; }

    # The service worker must never be cached hard. It is the only thing that
    # can replace itself, so a cached sw.js strands users on an old app with no
    # way back. Browsers also cap SW script caching at 24h — do not rely on it.
    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        types { application/javascript js; }
    }

    # index.html is the ENTIRE app (all JS/CSS inlined) and its filename carries
    # no content hash, so the HTTP cache is the only thing between users and a
    # stale build. Always revalidate.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
    }

    # Icons are content-stable and tiny — safe to cache hard.
    location /icons/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        # SPA fallback: every route serves the app shell.
        # NOTE: this returns 200 + HTML for ANY missing file, so a typo'd asset
        # path yields an HTML document instead of a 404. public/sw.js and the
        # icons exist as real files, so $uri matches them before the fallback —
        # but the service worker also checks Content-Type before caching, so a
        # missing asset can never poison the cache with an HTML document.
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    # index.html is ~1.2MB raw / ~320KB gzipped — text/html here is what makes
    # the single-file app cheap to re-fetch. Include the manifest too.
    gzip_types text/plain text/css text/html application/json application/javascript application/manifest+json image/svg+xml;
    client_max_body_size 10m;
}

