services:
  db:
    image: postgres:16-alpine
    container_name: friendly-crm-db
    environment:
      POSTGRES_DB: friendly_crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_only
    ports:
      - "5433:5432"
    volumes:
      - friendly_crm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d friendly_crm"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  friendly_crm_pgdata:
