# Friendly CRM — nginx: serves the SPA, proxies /api to the Fastify backend.
# After certbot issues certificates, uncomment the 443 block and the redirect.

# The SPA is a single-file build with inline scripts/styles, so CSP must
# permit 'unsafe-inline'; every other directive is locked to 'self'. Adjust
# connect-src if you point the app at an API on a different host.

server {
    listen 80;
    server_name _;                     # replace with your domain, e.g. crm.example.com
    server_tokens off;                 # don't leak the nginx version in headers / error pages

    # ACME challenge for certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Uncomment after SSL is issued to force HTTPS:
    # location / { return 301 https://$host$request_uri; }

    # ── Security headers ──
    #
    # An INCLUDE, repeated in every location below, and that repetition is not
    # redundancy. nginx drops ALL inherited add_header directives in any block
    # that declares even one of its own. Three locations here set Cache-Control,
    # and `try_files … /index.html` internally redirects into one of them — so
    # the security headers written at this level never reached the app document
    # at all. They were present in the config, absent on the wire.
    #
    # Generated by deploy/gen-csp.mjs, which pins the inline bundle by sha256.
    # Regenerate after every build: the hash changes with the bundle, and a
    # stale hash is a blank page.
    include /etc/nginx/security-headers.conf;

    location /api/ {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── PWA ──
    # nginx's bundled mime.types has no entry for .webmanifest on many builds,
    # so it would be sent as application/octet-stream — Chrome then ignores the
    # manifest entirely and the install prompt SILENTLY never fires. Declare it.
    types { application/manifest+json webmanifest; }

    # The service worker must never be cached hard. It is the only thing that
    # can replace itself, so a cached sw.js strands users on an old app with no
    # way back. Browsers also cap SW script caching at 24h — do not rely on it.
    location = /sw.js {
        root /usr/share/nginx/html;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        types { application/javascript js; }
    }

    # index.html is the ENTIRE app (all JS/CSS inlined) and its filename carries
    # no content hash, so the HTTP cache is the only thing between users and a
    # stale build. Always revalidate.
    location = /index.html {
        root /usr/share/nginx/html;
        # This is the block `try_files … /index.html` internally redirects into,
        # so it is the one that actually decides what headers the APP is served
        # with. Before this include it set Cache-Control and nothing else.
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Icons are content-stable and tiny — safe to cache hard.
    location /icons/ {
        root /usr/share/nginx/html;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ── The embeddable chatbot ──
    #
    # /chat/:slug is the widget a builder iframes into their OWN website, so it
    # is the one route that must be framable cross-origin. It gets a header set
    # with frame-ancestors * and no X-Frame-Options — that header has no
    # "allow any origin" value, so sending it at all would break every embed the
    # product tells customers to paste.
    #
    # It names index.html DIRECTLY rather than falling through to the SPA
    # fallback. The `try_files $uri $uri/ /index.html` in `location /` ends in a
    # URI, which is an internal REDIRECT: it re-enters location matching and
    # lands in `location = /index.html`, picking up frame-ancestors 'none' and
    # silently undoing this entire block. Naming the file keeps the response
    # here, where these headers apply.
    location ^~ /chat/ {
        root /usr/share/nginx/html;
        include /etc/nginx/security-headers-embed.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        # SPA fallback: every route serves the app shell.
        # NOTE: this returns 200 + HTML for ANY missing file, so a typo'd asset
        # path yields an HTML document instead of a 404. public/sw.js and the
        # icons exist as real files, so $uri matches them before the fallback —
        # but the service worker also checks Content-Type before caching, so a
        # missing asset can never poison the cache with an HTML document.
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    # index.html is ~1.2MB raw / ~320KB gzipped — text/html here is what makes
    # the single-file app cheap to re-fetch. Include the manifest too.
    gzip_types text/plain text/css text/html application/json application/javascript application/manifest+json image/svg+xml;
    client_max_body_size 10m;
}

